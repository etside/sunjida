name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

  workflow_dispatch:

jobs:
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            func_name=$(basename "$dir")
            if [ "$func_name" != "_shared" ]; then
              echo "Deploying function: $func_name"
              supabase functions deploy "$func_name" --no-verify-jwt
            fi
          done

      - name: Set function secrets
        run: |
          supabase secrets set OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          supabase secrets set GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          supabase secrets set VOICE_AGENT_MODEL=${{ secrets.VOICE_AGENT_MODEL }} || true
          supabase secrets set VOICE_AGENT_MAX_TOKENS=${{ secrets.VOICE_AGENT_MAX_TOKENS }} || true
          supabase secrets set LOVABLE_API_KEY=${{ secrets.LOVABLE_API_KEY }} || true
