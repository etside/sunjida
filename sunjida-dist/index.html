  <body>
    <div id="root"></div>
    <script>
      // Register service worker for Supabase PHP fallback
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }

      // Bengali TTS override — use PHP backend for Bengali audio
      (function() {
        var origSpeak = window.speechSynthesis && window.speechSynthesis.speak;
        if (!origSpeak) return;
        var isBengali = /[\u0980-\u09FF]/;
        var audio = null;
        window.speechSynthesis.speak = function(utter) {
          if (isBengali.test(utter.text)) {
            // Fetch Bengali audio from PHP TTS endpoint
            if (audio) { audio.pause(); audio = null; }
            fetch('/api/tts.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: utter.text, voice: 'nova', speed: 1.0 })
            }).then(function(res) {
              if (!res.ok) throw new Error('TTS failed');
              return res.blob();
            }).then(function(blob) {
              audio = new Audio(URL.createObjectURL(blob));
              audio.play();
            }).catch(function() {
              // Fallback to browser TTS
              origSpeak.call(window.speechSynthesis, utter);
            });
            return;
          }
          origSpeak.call(window.speechSynthesis, utter);
        };
      })();
    </script>
